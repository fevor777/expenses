<article class="h-entry" [class.h-entry--with-date]="item.showDateTitle">
  <header *ngIf="item.showDateTitle" class="h-date-group">
    <span class="h-date">{{ item.date | date: 'dd-MM-YYYY' }}</span>
    <span class="h-date-total">{{ totalAmountPerDays }}€</span>
  </header>
  <div class="h-card">
    <div class="h-accent"></div>
    <div class="h-body">
      <div class="h-row h-row--top">
        <span class="h-amount" aria-label="Amount">{{ item.amount }}€</span>
        <div class="h-actions" aria-label="Actions">
          <button
            type="button"
            class="h-btn"
            (click)="onEditIconClick(item)"
            aria-label="Edit amount"
          >
            <i class="fas fa-pencil-alt"></i>
          </button>
        </div>
      </div>
      <div class="h-row h-meta">
        <span class="h-category-label">Category:</span>
        <span
          class="h-category app-link"
          (click)="onFilterByCategory(item.category)"
          >{{ getCategoryNameByIdFunc(item.category) }}</span
        >
        <span class="h-dot">•</span>
        <time
          class="h-time"
          [attr.datetime]="item.date | date: 'yyyy-MM-ddTHH:mm'"
          >{{ item.date | date: 'HH:mm' }}</time
        >
      </div>
      <div class="h-row h-desc">
        <span class="h-description-label">Description:</span>
        <ng-container *ngIf="item.description; else noDescText">
          <span class="h-description">"{{ item.description }}"</span>
        </ng-container>
        <ng-template #noDescText
          ><span class="h-description h-description--empty"
            >(none)</span
          ></ng-template
        >
      </div>
      <div class="h-row h-ops">
        <button
          type="button"
          class="h-linkdanger"
          (click)="onDeleteLabelClick(item)"
        >
          Delete
        </button>
        <button
          *ngIf="
            !item.isDeletedFromBalance &&
            getCategoryByIdFunc(item.category).includeInBalance
          "
          type="button"
          class="h-linkdanger"
          (click)="onDeleteFromBalanceLabelClick(item)"
        >
          Delete from balance
        </button>
      </div>
    </div>
  </div>
  <div *ngIf="!item.showDateTitle" class="h-spacer" aria-hidden="true"></div>
</article>
