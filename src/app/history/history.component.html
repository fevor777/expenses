<div class="history-container" #historyRoot>
  <div class="history-fixed-wrapper" #historyFixed>
    <div class="history-nav">
    <span id="back" class="app-link history-back-link" [routerLink]="'/'"
      >< Home</span
    >
    <span
      id="stats"
      class="app-link history-stats-link"
      [routerLink]="'/statistics'"
      >Statistics ></span
    >
    </div>
    <div class="history-filter-wrapper">
      <app-multi-filter
        [value]="defaultFilter"
        [totalAmount]="totalAmount"
        [defaultDateValue]="defaultDateValue"
        [showDetailsIcon]="true"
        [activeBucketCount]="activeBucketCount"
        [totalBucketCount]="totalBucketCount"
        [expenseEntryCount]="expenseEntryCount"
        [enableCompactOnScroll]="true"
        (selectedFilters)="updateFilterAndLoadExpenses($event)"
        (navigateToStatisticsIconClick)="navigateToStatistics()"
        (expandStateChange)="onMultiFilterExpandChange($event)"
      ></app-multi-filter>
    </div>
  </div>
  <div class="history-content" #historyContent>
  <ng-container
    *ngIf="
      (expenses$ | async)?.length > 0 && (expenses$ | async);
      let expenses;
      else: elseBlock
    "
  >
    <app-history-item
      *ngFor="let item of expenses"
      [item]="item"
      [totalAmountPerDays]="getTotalAmountPerDay(item.date)"
      (editIconClick)="updateExpense($event)"
      (filterByCategory)="filterByCategory($event)"
      (deleteLabelClick)="onDelete($event)"
      (deleteFromBalanceLabelClick)="onDeleteFromBalance($event)"
    ></app-history-item
  ></ng-container>

  <ng-template #elseBlock>
    <div class="history-empty">
      <span>Для этих категорий и периода трат нет</span>
    </div>
  </ng-template>

  <app-expense-edit-modal
    *ngIf="showEditModal"
    [expense]="editingExpense"
    (apply)="onApplyEdit($event)"
    (cancel)="closeEditModal()"
  ></app-expense-edit-modal>
  </div>
</div>
