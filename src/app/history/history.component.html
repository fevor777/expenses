<div class="history-container">
  <span
    id="back"
    class="app-link"
    [routerLink]="'/'"
    >< Back</span
  ><br />
  <app-multi-filter
    [value]="defaultFilter"
    [totalAmount]="totalAmount"
    [defaultDateValue]="defaultDateValue"
    (selectedFilters)="updateFilterAndLoadExpenses($event)"
  ></app-multi-filter>
  <div *ngIf="!expenses.length" class="history-empty">
    <span>Для этих категорий и периода трат нет</span>
  </div>
  <app-history-item
    *ngFor="let item of expenses"
    [item]="item"
    [totalAmountPerDays]="getTotalAmountPerDay(item.date)"
    (editAmountIconClick)="changeAmount($event)"
    (filterByCategory)="filterByCategory($event)"
    (chartIconClick)="navigateToChart($event)"
    (editDescriptionIconClick)="changeDescription($event)"
    (deleteLabelClick)="onDelete($event)"
    (deleteFromBalanceLabelClick)="onDeleteFromBalance($event)"
  ></app-history-item>
</div>
