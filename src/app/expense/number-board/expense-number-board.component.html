<div class="expense-number-board">
  <app-expense-number-board-header
    [amount]="amount"
    [currencyCode]="getCurrencySymbol()"
    (addDescription)="addDescription()"
    (clearAmount)="clearAmount($event)"
    (openCalculator)="openCalculatorEmit()"
    (openEditLatest)="openEditLatest($event)"
    (currencyClick)="onCurrencyClick()"
    (deleteClick)="onDeleteClick()"
  ></app-expense-number-board-header>
  <div
    class="expense-number-board-body"
    (swipedown)="onSwipeDown($event)"
    (swipeup)="onSwipeUp()"
    (swipeleft)="onSwipeLeft()"
    (swiperight)="onSwipeRight()"
  >
    <div (click)="onNumberClick('1')" class="expense-number-board-item">1</div>
    <div (click)="onNumberClick('2')" class="expense-number-board-item">2</div>
    <div (click)="onNumberClick('3')" class="expense-number-board-item">3</div>
    <div (click)="onNumberClick('4')" class="expense-number-board-item">4</div>
    <div (click)="onNumberClick('5')" class="expense-number-board-item">5</div>
    <div (click)="onNumberClick('6')" class="expense-number-board-item">6</div>
    <div (click)="onNumberClick('7')" class="expense-number-board-item">7</div>
    <div (click)="onNumberClick('8')" class="expense-number-board-item">8</div>
    <div (click)="onNumberClick('9')" class="expense-number-board-item">9</div>
    <div
      (click)="onNumberClick('.')"
      (pointerdown)="onDecimalPointerDown($event)"
      (pointerup)="onDecimalPointerUp($event)"
      (pointerleave)="onDecimalPointerLeave()"
      class="expense-number-board-item key-func"
      aria-label="Decimal point (hold)"
    >
      .
    </div>
    <div
      (click)="onNumberClick('0')"
      (pointerdown)="onZeroPointerDown($event)"
      (pointerup)="onZeroPointerUp($event)"
      (pointerleave)="onZeroPointerLeave()"
      class="expense-number-board-item"
      aria-label="0 (hold for special action)"
    >
      0
    </div>
    <div
      (click)="onDeleteClick()"
      class="expense-number-board-item key-delete"
      aria-label="Delete last digit"
    >
      <i class="fas fa-backspace"></i>
    </div>
  </div>
</div>

<app-description-edit-modal
  *ngIf="showDescriptionModal"
  [description]="description"
  (apply)="onDescriptionApply($event)"
  (cancel)="onDescriptionCancel()"
></app-description-edit-modal>

<app-expense-edit-modal
  *ngIf="showEditLatestModal"
  [isLoadLatestExpenses]="true"
  (apply)="onApplyEditLatest($event)"
  (cancel)="onCancelEditLatest()"
  (delete)="onDeleteLatest($event)"
></app-expense-edit-modal>
