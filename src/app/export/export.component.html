<span id="back" class="app-link history-back-link" routerLink="/"
  >&lt; Back</span
>
<app-tabs-container [(active)]="activeTab">
  <app-tab key="general" label="General">
    <div style="margin-top: 12px">
      <div>
        <span
          >Savings: <strong>{{ (savings$ | async) || 0 }}</strong>
          <span
            (click)="onEditSavings()"
            title="Edit savings"
            style="
              cursor: pointer;
              display: inline-block;
              margin-left: 8px;
              vertical-align: middle;
            "
            >✏️</span
          >
        </span>
      </div>
    </div>
  </app-tab>
  <app-tab key="budget" label="Budget">
    <div style="margin-top: 12px">
      <div class="budget-start-row">
        <label for="irregularBudgetValue" class="bsd-label"
          >Budget:</label
        >
        <input
          id="irregularBudgetValue"
          type="number"
          min="1"
          [(ngModel)]="irregularBudgetValue"
          class="bsd-input"
        />
      </div>
      <div class="budget-start-row">
        <label for="budgetStartDay" class="bsd-label"
          >Start Budget Period:</label
        >
        <input
          id="budgetStartDay"
          type="number"
          min="1"
          max="31"
          [(ngModel)]="budgetStartDay"
          class="bsd-input"
        />
      </div>
      <div class="budget-start-row">
        <label for="budgetDuration" class="bsd-label"
          >Budget Period Duration:</label
        >
        <input
          id="budgetDuration"
          type="number"
          min="1"
          max="60"
          [(ngModel)]="budgetPeriodDuration"
          class="bsd-input"
        />
        <span class="bsd-hint">(1–60)</span>
      </div>
      <div class="budget-start-row" *ngIf="budgetPeriodLabel">
        <span class="bsd-label">Period Preview:</span>
        <span class="bsd-value">{{ budgetPeriodLabel }}</span>
      </div>
      <button
        type="button"
        (click)="onSaveBudget()"
        class="btn btn-primary bsd-save"
      >
        Save
      </button>
    </div>
  </app-tab>
  <app-tab key="export" label="Export">
    <div style="margin-top: 12px" *ngIf="user$ | async as user">
      <button (click)="exportCSV()">Export from cloud to CSV!</button
      ><br /><br />
    </div>
  </app-tab>
  <app-tab key="auth" label="Auth">
    <div style="margin-top: 12px">
      <div *ngIf="user$ | async as user; else loginBlock">
        <h3>Welcome, {{ user.displayName }}!!!</h3>
        <button (click)="logout()">Sign Out</button>
      </div>
      <ng-template #loginBlock>
        <button (click)="login()">Sign in with Google</button>
      </ng-template>
    </div>
  </app-tab>
</app-tabs-container>
