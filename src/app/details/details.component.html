<div class="details">
  <div class="details-nav">
    <span class="app-link details-history-link" [routerLink]="backUrl">{{
      backLabel
    }}</span>
    <span class="app-link details-home-link" [routerLink]="altUrl">{{
      altLabel
    }}</span>
  </div>
  <app-multi-filter
    [value]="initialFilter"
    [totalAmount]="totalAmount"
    [defaultDateValue]="defaultDateValue"
    [showHistoryIcon]="true"
    (selectedFilters)="applyFilters($event)"
  ></app-multi-filter>
  <div class="section">
    <div class="section-header" (click)="toggle('irregularGauge')">
      <span>Использование нерегулярного бюджета</span>
      <button type="button" class="collapse-btn">
        {{ collapsed.irregularGauge ? '▼' : '▲' }}
      </button>
    </div>
    <div class="section-body" *ngIf="!collapsed.irregularGauge">
      <ng-container *ngIf="isMonth; else gaugeMsg">
        <div class="irregular-block single">
          <div class="ib-chart">
            <app-irregular-budget-gauge
              [expenses]="expenses"
              [budget]="irregularBudget"
            ></app-irregular-budget-gauge>
          </div>
        </div>
      </ng-container>
      <ng-template #gaugeMsg>
        <div class="placeholder-msg">Доступно только для месячного периода</div>
      </ng-template>
    </div>
  </div>
  <div class="section">
    <div class="section-header" (click)="toggle('irregularCumulative')">
      <span>Накопленные нерегулярные расходы</span>
      <button type="button" class="collapse-btn">
        {{ collapsed.irregularCumulative ? '▼' : '▲' }}
      </button>
    </div>
    <div class="section-body" *ngIf="!collapsed.irregularCumulative">
      <ng-container *ngIf="isMonth; else cumulativeMsg">
        <div class="irregular-block single">
          <div class="ib-chart wide">
            <app-irregular-cumulative
              [expenses]="expenses"
              [budget]="irregularBudget"
              [date]="currentFilter?.date"
            ></app-irregular-cumulative>
          </div>
        </div>
      </ng-container>
      <ng-template #cumulativeMsg>
        <div class="placeholder-msg">Доступно только для месячного периода</div>
      </ng-template>
    </div>
  </div>
  <div class="section">
    <div class="section-header" (click)="toggle('bar')">
      <span>Динамика расходов (Bar / Line)</span>
      <button type="button" class="collapse-btn">
        {{ collapsed.bar ? '▼' : '▲' }}
      </button>
    </div>
    <div class="section-body" *ngIf="!collapsed.bar">
      <app-multi-chart
        [expenses]="expenses"
        [filter]="currentFilter?.date"
      ></app-multi-chart>
    </div>
  </div>
  <div class="section">
    <div class="section-header" (click)="toggle('composition')">
      <span>Категории (дерево)</span>
      <button type="button" class="collapse-btn">
        {{ collapsed.composition ? '▼' : '▲' }}
      </button>
    </div>
    <div
      class="section-body"
      *ngIf="!collapsed.composition"
      style="margin-top: 4px"
    >
      <app-composition-charts [expenses]="expenses"></app-composition-charts>
    </div>
  </div>
  <div class="section">
    <div class="section-header" (click)="toggle('micro')">
      <span>Микро-визуализации</span>
      <button type="button" class="collapse-btn">
        {{ collapsed.micro ? '▼' : '▲' }}
      </button>
    </div>
    <div class="section-body" *ngIf="!collapsed.micro">
      <app-micro-visuals
        [expenses]="expenses"
        [topN]="5"
        [dateFrame]="currentFilter?.date"
        [selectedCategories]="currentFilter?.categories"
        (categorySelected)="onCategorySelected($event)"
        (categoryRemoved)="onCategoryRemoved($event)"
      ></app-micro-visuals>
    </div>
  </div>
</div>
