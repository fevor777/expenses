<div class="details">
  <app-multi-filter
    [value]="initialFilter"
    [totalAmount]="totalAmount"
    [defaultDateValue]="defaultDateValue"
    [showHistoryIcon]="true"
    (selectedFilters)="applyFilters($event)"
  ></app-multi-filter>
  <app-bar-chart
    [expenses]="expenses"
    [filter]="currentFilter?.date"
  ></app-bar-chart>
  <div style="margin-top:20px">
    <div style="font-weight:600;font-size:14px;margin:4px 0 6px 4px;">Категории (дерево)</div>
    <app-composition-charts [expenses]="expenses"></app-composition-charts>
  </div>
  <app-micro-visuals [expenses]="expenses" [topN]="5" [dateFrame]="currentFilter?.date" [selectedCategories]="currentFilter?.categories" (categorySelected)="onCategorySelected($event)" (categoryRemoved)="onCategoryRemoved($event)"></app-micro-visuals>
</div>
