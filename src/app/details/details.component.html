<div class="details">
  <div class="details-nav">
    <span class="app-link details-home-link" [routerLink]="'/'"> < Home</span>
    <span class="app-link details-home-link" [routerLink]="'/'">Home ></span>
  </div>

  <div class="period-summaries" *ngIf="summaries$ | async as summaries">
    <section *ngFor="let s of summaries" class="period-summary">
      <h3>{{ s.title }}</h3>
      <p *ngFor="let p of s.paragraphs" style="white-space:pre-line;">
        {{ p }}
      </p>
      <hr />
    </section>
  </div>
</div>
