<div class="calendar" *ngIf="show">
  <div class="calendar-header">
    <button
      class="nav-btn"
      (click)="prevMonth()"
      aria-label="Previous month"
      [disabled]="mode === 'period'"
    >
      ‹
    </button>
    <div class="month-label" (click)="goToday()">{{ monthLabel }}</div>
    <button
      class="nav-btn"
      (click)="nextMonth()"
      aria-label="Next month"
      [disabled]="mode === 'period'"
    >
      ›
    </button>
  </div>
  <div class="week-labels">
    <div class="week-number-header">Н</div>
    <div class="week-label" *ngFor="let wd of weekDayLabels">{{ wd }}</div>
  </div>
  <div class="weeks">
    <div class="week" *ngFor="let w of weeks">
      <div class="week-number" (click)="selectWeek(w)">
        {{ w.weekNumber }}
        <app-day-tooltip
          *ngIf="isWeekTooltipVisible(w.weekNumber)"
          [data]="weekTooltip"
          (navigateHistory)="onNavigateHistory()"
          (navigateStatistics)="onNavigateStatistics()"
        ></app-day-tooltip>
      </div>
      <div
        class="day"
        *ngFor="let d of w.days"
        (click)="selectDay(d)"
        [class.outside]="!d.inMonth"
        [class.today]="d.isToday"
        [class.selected]="d.isSelected"
        [class.weekend]="d.isWeekend"
        [class.period-core]="mode === 'period' && isInBudgetCore(d.date)"
        [class.period-buffer]="
          mode === 'period' &&
          !isInBudgetCore(d.date) &&
          isInBudgetBuffer(d.date)
        "
        [class.calendar-past-days-opacity]="
          mode === 'period' && isBudgetCorePast(d.date) && !showVelocityHistory
        "
        [class.calendar-past-days-opacity-v2]="
          mode === 'period' && isBudgetCorePast(d.date) && showVelocityHistory
        "
        [style.opacity]="isTooltipVisible(d.date) ? 1 : null"
        [class.period-past]="mode === 'period' && isBudgetCorePast(d.date)"
        [class.limit-under]="showVelocityHistory && d.limitState === 'under'"
        [class.limit-near]="showVelocityHistory && d.limitState === 'near'"
        [class.limit-over]="showVelocityHistory && d.limitState === 'over'"
        [attr.aria-selected]="d.isSelected"
        [attr.data-date]="d.date.toISOString()"
      >
        <span class="day-number">{{ d.date.getDate() }}</span>
        <span
          *ngIf="isExhaustionDay(d.date)"
          class="exhaustion-dot"
          aria-label="Прогноз исчерпания бюджета"
        ></span>
        <app-day-tooltip
          *ngIf="isTooltipVisible(d.date)"
          [data]="tooltip"
          (navigateHistory)="onNavigateHistory()"
          (navigateStatistics)="onNavigateStatistics()"
        ></app-day-tooltip>
      </div>
    </div>
  </div>
  <div
    *ngIf="summaryAvailable"
    class="calendar-separator"
    aria-hidden="true"
  ></div>
  <div
    *ngIf="summaryAvailable"
    class="calendar-budget-strip"
    [attr.aria-label]="stripAriaLabel"
  >
    <span class="segment spent-total">{{ stripSpentTotal }}</span>
    <span class="sep">•</span>
    <span class="segment remaining" title="Остаток">{{ stripRemaining }}</span>
    <span class="sep">|</span>
    <span class="segment days" title="Прошло / всего дней">
      ⏳ {{ stripDaysPassedFrame }}</span
    >
    <span class="sep">•</span>
    <span class="segment days-left" title="Осталось дней">{{
      stripDaysLeft
    }}</span>
    <span class="sep">|</span>
    <span class="segment need" title="Нужно в день" *ngIf="stripNeedPerDay"
      >{{ stripNeedIcon }}{{ stripNeedIcon ? ' ' : ''
      }}{{ stripNeedPerDay }}</span
    >
  </div>
  <div class="calendar-mode-switch">
    <div class="calendar-controls">
      <i (click)="onClose()" class="calendar-close-icon fas fa-times"></i>
      <app-segmented-switch
        [options]="calendarModes"
        [active]="mode"
        ariaLabel="Переключатель режима календаря"
        (select)="onModeSelect($event)"
      ></app-segmented-switch>
      <label
        class="velocity-history-toggle"
        aria-label="Показать историю темпа"
      >
        <input type="checkbox" [(ngModel)]="showVelocityHistory" /> Темп
      </label>
    </div>
  </div>
</div>
