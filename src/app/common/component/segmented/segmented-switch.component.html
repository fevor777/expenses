<div
  class="segmented"
  role="group"
  [attr.aria-label]="ariaLabel"
  [attr.data-active]="active"
>
  <div class="segmented-bg" aria-hidden="true"></div>
  <button
    *ngFor="let opt of options"
    type="button"
    class="segmented-btn"
    (click)="onClick(opt.value)"
    [attr.aria-pressed]="active === opt.value"
    [class.is-active]="active === opt.value"
  >
    {{ opt.label }}
  </button>
</div>
