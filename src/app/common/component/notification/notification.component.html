<div
  *ngIf="show"
  class="notification-container {{ variant }}"
  [class.is-hidden]="hiding"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <span class="notification-icon" *ngIf="icon" [innerHTML]="icon"></span>
  <span class="notification-content" [innerHTML]="message"></span>
  <div class="notification-actions">
    <button
      type="button"
      (click)="onCloseNotification()"
      class="notification-close"
      aria-label="Close notification"
    >
      ×
    </button>
    <button
      type="button"
      (click)="onSendBrowserNotification()"
      class="notification-browser"
      aria-label="Send browser notification"
      title="Send browser notification"
    >
      <i class="fas fa-bell"></i>
    </button>
    <button
      type="button"
      (click)="onNavigateDetails()"
      class="notification-details"
      aria-label="Open details"
      title="Details"
    >
      <i class="fas fa-list"></i>
    </button>
  </div>
</div>
