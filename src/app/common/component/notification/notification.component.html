<div
  *ngIf="show"
  class="notification-container {{ variant }}"
  [class.is-hidden]="hiding"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <div class="notification-main">
    <span class="notification-icon" *ngIf="icon" [innerHTML]="icon"></span>
    <div class="notification-body">
      <div class="notification-content" *ngIf="message; else messageListTemplate" [innerHTML]="message"></div>
      <ng-template #messageListTemplate>
        <div class="notification-list" *ngFor="let msg of messageList" [innerHTML]="msg"></div>
      </ng-template>
      <span *ngIf="isExpenseAddedContext">Description:</span>
      <div *ngIf="isExpenseAddedContext" class="notification-marks-row">
        <button type="button" class="mark-btn" (click)="appendMark(' ? ')" title="#необязательный" aria-label="#необязательный">#необязательный</button>
        <button type="button" class="mark-btn" (click)="appendMark(' ! ')" title="#лишний" aria-label="#лишний">#лишний</button>
      </div>
      <div *ngIf="isExpenseAddedContext" class="notification-edit-row">
        <input
          type="text"
          class="desc-input"
          [placeholder]="lastExpense?.description ? 'Изменить описание' : 'Добавить описание'"
          [(ngModel)]="this.lastExpense.description"
          (keyup.enter)="saveDescription()"
        />
        <button type="button" class="save-btn" (click)="saveDescription()">OK</button>
      </div>
    </div>
  </div>
  <div class="notification-actions">
    <button
      type="button"
      (click)="onCloseNotification()"
      class="notification-close"
      aria-label="Close notification"
    >
      ×
    </button>
    <button
      type="button"
      (click)="onSendBrowserNotification()"
      class="notification-browser"
      aria-label="Send browser notification"
      title="Send browser notification"
    >
      <i class="fas fa-bell"></i>
    </button>
    <button
      type="button"
      (click)="onNavigateDetails()"
      class="notification-details"
      aria-label="Open details"
      title="Details"
    >
      <app-period-summary-icon></app-period-summary-icon>
    </button>
  </div>
</div>
