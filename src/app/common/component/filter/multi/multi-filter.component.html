<div class="app-multi-filter">
  <div class="app-multi-filter-container">
    <span *ngIf="
        (dateFilter?.display || getCategoryFilters()?.length) && !expandFilters
      ">
      <div class="app-multi-filter-header">
        <span [style.font-weight]="'bold'">Фильтры:</span>
        <i (click)="clearFilters()" class="fas fa-redo-alt" [style.padding-left]="'10px'"></i>
      </div>
      <div class="app-multi-filter-header">
        <span [style.margin-right.px]="10">Период:</span>
        <span [style.color]="'#ff6f61'">{{
          dateFilter?.display || "Весь"
          }}</span>
      </div>
      <div class="app-multi-filter-header" *ngIf="descriptionFilter">
        <span class="description-filter-label">Description:</span>
        <span class="description-filter-value">"{{ descriptionFilter }}"</span>
      </div>
      <div class="app-multi-filter-header">
        <span [style.margin-right.px]="10">Категории:</span>
        <span [style.color]="'#ff6f61'">{{
          getCategoryFilters() || "Все"
          }}</span>
      </div>
    </span>
    <span *ngIf="
        (!dateFilter?.display && !getCategoryFilters()?.length) || expandFilters
      ">
      <div class="app-multi-filter-header">
        <span>Общий расход: </span>
        <span class="app-multi-filter-total-amount">{{ totalAmount }}€</span>
        <i *ngIf="showHistoryIcon" class="fa-solid fa-list category-details-icon" (click)="navigateToHistory()"
          title="Перейти к истории"></i>
        <i *ngIf="showDetailsIcon" class="fas fa-chart-bar history-item-chart" (click)="navigateToDetails()"></i>
      </div>
    </span>
    <button class="app-multi-filter-button" [ngClass]="{ 'app-multi-filter-button-active': expandFilters }"
      (click)="toggleExpandFilters()">
      <i class="fas fa-filter"></i>
    </button>
  </div>
  <div [style.margin.px]="'10'" *ngIf="(dateFilter?.display || getCategoryFilters()?.length) && !expandFilters">
    <div class="app-multi-filter-header" [style.margin-bottom.px]="30">
      <span>Общий расход: </span>
      <span class="app-multi-filter-total-amount">{{ totalAmount }}€</span>
      <i *ngIf="showHistoryIcon" class="fa-solid fa-list category-details-icon" (click)="navigateToHistory()"
        title="Перейти к истории"></i>
      <i *ngIf="showDetailsIcon" class="fas fa-chart-bar history-item-chart" (click)="navigateToDetails()"
        title="Перейти к истории"></i>
    </div>
  </div>
  <div class="app-multi-filter-expand" *ngIf="expandFilters">
    <div class="app-multi-filter-expand-items">
      <div class="app-multi-filter-expand-date">
        <app-date-filter [defaultValue]="defaultDateValue" [value]="dateFilter"
          (changeFilter)="emitDateFilter($event)"></app-date-filter>
      </div>
      <div class="description-filter-wrapper">
        <input type="text" class="description-filter-input" placeholder="Description..." [(ngModel)]="descriptionFilter"
          (ngModelChange)="emitDescriptionFilter()" />
      </div>
      <app-category-filter [value]="predefineCategories"
        (selectedCategories)="emitCategoryFilters($event)"></app-category-filter>
    </div>
  </div>
</div>
