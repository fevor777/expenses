<div class="statistics-period">
  <!-- Compact summary shown when showCompact true -->
  <div
    class="statistics-period-compact statistics-period-compact-active"
    *ngIf="showCompact"
    (click)="onCompactClick()"
  >
    <span class="statistics-period-compact-title">{{ compactLabel }}</span>
  </div>
  <!-- Full dropdowns hidden when compact -->
  <app-date-filter-drop-down
    *ngIf="!showCompact"
    [options]="optionsForDaysSelect"
    [name]="Mode.DAY"
    [isHowSuggestionButton]="isHowSuggestionButton"
    [activatedName]="currentFilter?.value?.mode"
    [value]="currentFilter"
    [hideOptions]="clickedMode !== Mode.DAY"
    (select)="onDateSelect($event)"
    (toggleClick)="onDropdownToggleClick($event)"
  ></app-date-filter-drop-down>

  <app-date-filter-drop-down
    *ngIf="!showCompact"
    [options]="optionsForWeeksSelect"
    [name]="Mode.WEEK"
    [isHowSuggestionButton]="isHowSuggestionButton"
    [activatedName]="currentFilter?.value?.mode"
    [value]="currentFilter"
    [hideOptions]="clickedMode !== Mode.WEEK"
    (select)="onDateSelect($event)"
    (toggleClick)="onDropdownToggleClick($event)"
  ></app-date-filter-drop-down>

  <app-date-filter-drop-down
    *ngIf="!showCompact"
    [options]="optionsForMonthsSelect"
    [name]="Mode.MONTH"
    [isHowSuggestionButton]="isHowSuggestionButton"
    [activatedName]="currentFilter?.value?.mode"
    [value]="currentFilter"
    [hideOptions]="clickedMode !== Mode.MONTH"
    (select)="onDateSelect($event)"
    (toggleClick)="onDropdownToggleClick($event)"
  ></app-date-filter-drop-down>

  <app-date-filter-drop-down
    *ngIf="!showCompact"
    [options]="optionsForYearsSelect"
    [name]="Mode.YEAR"
    [isHowSuggestionButton]="isHowSuggestionButton"
    [activatedName]="currentFilter?.value?.mode"
    [value]="currentFilter"
    [hideOptions]="clickedMode !== Mode.YEAR"
    (select)="onDateSelect($event)"
    (toggleClick)="onDropdownToggleClick($event)"
  ></app-date-filter-drop-down>
  <div *ngIf="!showCompact" class="date-filter-custom">
    <button
      type="button"
      class="date-filter-custom-button"
      [class.date-filter-custom-button-active]="
        currentFilter?.value?.mode === Mode.CUSTOM
      "
      (click)="toggleCustomRange()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="customRangeOpen"
    >
      Период
    </button>
    <div
      *ngIf="customRangeOpen"
      class="date-filter-custom-popover"
      role="dialog"
      aria-label="Выбор периода"
    >
      <label>
        С
        <input
          type="date"
          [(ngModel)]="customStartDate"
          [max]="maxDate"
          (ngModelChange)="onCustomDateChange()"
        />
      </label>
      <label>
        По
        <input
          type="date"
          [(ngModel)]="customFinishDate"
          [max]="maxDate"
          (ngModelChange)="onCustomDateChange()"
        />
      </label>
      <p *ngIf="customRangeError" class="date-filter-custom-error">
        {{ customRangeError }}
      </p>
      <div class="date-filter-custom-actions">
        <button type="button" (click)="toggleCustomRange()">Отмена</button>
        <button
          type="button"
          (click)="applyCustomRange()"
          [disabled]="isCustomRangeInvalid"
        >
          Применить
        </button>
      </div>
    </div>
  </div>
  <i
    *ngIf="currentFilter?.display != defaultLabel"
    (click)="onRefresh()"
    class="fas fa-redo-alt statistics-refresh-button"
    title="Сбросить дату"
  ></i>

  <ng-content select="[app-date-filter-icons]"></ng-content>
  <div class="date-filter-count">
    <ng-content select="[app-date-filter-total]"></ng-content>
  </div>
</div>
