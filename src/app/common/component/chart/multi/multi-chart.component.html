<div class="multi-chart-wrapper">
  <div class="chart-type-switch">
    <app-segmented-switch
      [options]="chartTypeOptions"
      [active]="chartType"
      ariaLabel="Chart type switcher"
      (select)="onChartTypeSelect($event)"
    />
  </div>
  <div class="chart-container">
    <canvas
      baseChart
      [datasets]="chartOptions.datasets"
      [labels]="chartOptions.labels"
      [options]="chartOptions.options"
      [legend]="chartOptions.legend"
      [type]="chartType"
    ></canvas>
  </div>
  <div class="chart-summary">
    <!-- Clarified labels: nonZeroCount = filled buckets; totalCount = non-zero expense entries -->
    <span class="non-zero-count">
      {{ nonZeroCount }}/{{ periodBucketCount }} • {{ totalCount }}
    </span>
  </div>
</div>
